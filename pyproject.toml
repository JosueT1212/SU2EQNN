[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "su2eqnn"
version = "0.1.0"
description = "Spin(3) ≅ SU(2) equivariant neural network on Cl(3,0) — stepping stone toward L-GATr + Furey construction"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "clifford>=1.4",
    "numpy",
    "opt_einsum",
    "einops",
    "torch-geometric",
    "hydra-core",
    "omegaconf",
    "scikit-learn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
