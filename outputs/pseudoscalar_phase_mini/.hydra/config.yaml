data:
  path: data/toptagging_mini_axes_phases.npz
  rescale_data: true
  two_beams: true
model:
  in_mv_channels: 5
  hidden_mv_channels: 16
  num_blocks: 6
  num_heads: 4
training:
  epochs: 30
  batch_size: 32
  lr: 0.001
  validate_every_n_steps: 200
  checkpoint_path: checkpoints/pseudoscalar_phase_best.pt
evaluation:
  batch_size: 64
