data:
  path: data/toptagging_mini_axes_leading.npz
  rescale_data: true
  two_beams: true
  embedding: single_channel
  inject: [lead_pseudoscalar]

model:
  in_mv_channels: 1
  hidden_mv_channels: 16
  num_blocks: 6
  num_heads: 4

training:
  epochs: 30
  batch_size: 32
  optimizer: adam
  lr: 1.0e-3
  validate_every_n_steps: 200
  checkpoint_path: checkpoints/top_tagging_single_channel_axis_b_best.pt

evaluation:
  batch_size: 64
