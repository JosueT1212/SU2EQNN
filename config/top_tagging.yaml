data:
  path: data/toptagging_mini.npz
  rescale_data: true
  two_beams: true

model:
  hidden_mv_channels: 16
  num_blocks: 6
  num_heads: 4

training:
  epochs: 30
  batch_size: 32
  lr: 1.0e-3
  validate_every_n_steps: 200
  checkpoint_path: checkpoints/top_tagging_best.pt

evaluation:
  batch_size: 64
