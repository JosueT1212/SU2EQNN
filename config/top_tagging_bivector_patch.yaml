data:
  path: data/toptagging_mini_axes.npz
  rescale_data: true
  two_beams: true
  embedding: patch
  inject: []

model:
  in_mv_channels: 1
  patch_mv_channels: 4
  hidden_mv_channels: 16
  num_blocks: 6
  num_heads: 4

training:
  epochs: 30
  batch_size: 32
  lr: 1.0e-3
  validate_every_n_steps: 200
  checkpoint_path: checkpoints/top_tagging_bivector_patch_best.pt
  axis_dropout_p: 0.2
  scheduler: cosine_warm_restarts
  scheduler_t0_steps: 3125
  eta_min: 1.0e-5

evaluation:
  batch_size: 64
