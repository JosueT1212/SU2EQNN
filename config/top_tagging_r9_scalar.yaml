data:
  path: data/toptagging_mini_axes.npz
  rescale_data: true
  two_beams: true
  embedding: hybrid_r9
  inject: [cos_theta]

model:
  in_mv_channels: 4
  hidden_mv_channels: 16
  num_blocks: 6
  num_heads: 4

training:
  seed: 0
  epochs: 30
  batch_size: 32
  lr: 1.0e-3
  validate_every_n_steps: 200
  checkpoint_path: checkpoints/top_tagging_r9_scalar_best.pt

evaluation:
  batch_size: 64
