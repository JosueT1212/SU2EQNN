# Little group: p∧n̂_k for the 3 subjet axes in input channels. Durham exclusive-3 subjets in the jet rest frame,
# boosted xy-plane spurion, no time token. Naive counterpart: top_tagging_grade2_bivectors_full_b12.
data:
  path: data/toptagging_full_durham.npz
  rescale_data: true
  two_beams: true
  frame: rest
  beams: boosted
  beam_reference: xyplane
  embedding: multi_channel
  inject: []

model:
  in_mv_channels: 4
  hidden_mv_channels: 16
  num_blocks: 12
  num_heads: 8
  head_scale: true
  multi_query: false

training:
  seed: 0
  epochs: 21
  batch_size: 128
  lr: 0.0003
  validate_every_n_steps: 5000
  select_best_by: loss
  checkpoint_path: checkpoints/top_tagging_rest_durham_axes_full_b12.pt
  axis_dropout_p: 0.0
  scheduler: cosine
  scheduler_t0_steps: 198702
  eta_min: 0.0
  optimizer: lion
  weight_decay: 0.2
  betas: [0.9, 0.999]
  clip_grad_norm: 5

evaluation:
  batch_size: 256
  random_boost_rapidity: 0.0
  boost_seed: 0
